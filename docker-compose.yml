services:
  app:
    build:
      context: .
      args:
        APP_PYTHON_IMAGE: ${APP_PYTHON_IMAGE:-python:3.14-slim}
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8000}:8000"
    environment:
      ES_URL: http://elasticsearch:9200
      SEMANTIC_SIMILARITY_THRESHOLD: ${SEMANTIC_SIMILARITY_THRESHOLD:-0.92}
      REFRESH_INTERVAL_MINUTES: ${REFRESH_INTERVAL_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GIGACHAT_CLIENT_ID: ${GIGACHAT_CLIENT_ID:-}
      GIGACHAT_CLIENT_SECRET: ${GIGACHAT_CLIENT_SECRET:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_CHAT_MODEL: ${GIGACHAT_CHAT_MODEL:-GigaChat-2}
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY:-}
      CLOUDRU_NETWORK_INTERFACE: ${CLOUDRU_CONTAINER_NETWORK_INTERFACE:-}
      CLOUDRU_DOH_URL: ${CLOUDRU_DOH_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=4).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 7s
      retries: 12

volumes:
  elasticsearch-data:
