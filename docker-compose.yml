x-app: &app-image
  build:
    context: .
    args:
      APP_PYTHON_IMAGE: ${APP_PYTHON_IMAGE:-python:3.14-slim}
  image: parser-ecom-app
  init: true
  restart: unless-stopped
  stop_grace_period: 2m
  read_only: true
  tmpfs:
    - /tmp:mode=1777

x-db-environment: &db-environment
  PGHOST: postgres
  PGDATABASE: news
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: news_owner
      POSTGRES_PASSWORD: ${NEWS_DB_PASSWORD:-local-owner}
      NEWS_WEB_PASSWORD: ${NEWS_WEB_PASSWORD:-local-web}
      NEWS_PARSER_PASSWORD: ${NEWS_PARSER_PASSWORD:-local-parser}
      NEWS_AI_PASSWORD: ${NEWS_AI_PASSWORD:-local-ai}
      NEWS_CLEANUP_PASSWORD: ${NEWS_CLEANUP_PASSWORD:-local-cleanup}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U news_owner -d news"]
      interval: 5s
      timeout: 4s
      retries: 15

  migrate:
    <<: *app-image
    restart: "no"
    command: ["python", "-m", "app.database"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db-environment
      PGUSER: news_owner
      PGPASSWORD: ${NEWS_DB_PASSWORD:-local-owner}

  app:
    <<: *app-image
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8000}:8000"
    environment:
      <<: *db-environment
      PGUSER: news_web
      PGPASSWORD: ${NEWS_WEB_PASSWORD:-local-web}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=4).close()"]
      interval: 15s
      timeout: 5s
      retries: 5

  parser:
    <<: *app-image
    command: ["python", "-m", "app.collection"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *db-environment
      PGUSER: news_parser
      PGPASSWORD: ${NEWS_PARSER_PASSWORD:-local-parser}
      REFRESH_INTERVAL_MINUTES: ${REFRESH_INTERVAL_MINUTES:-30}

  ai:
    <<: *app-image
    command: ["python", "-m", "app.ai_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_started
    environment:
      <<: *db-environment
      PGUSER: news_ai
      PGPASSWORD: ${NEWS_AI_PASSWORD:-local-ai}
      ES_URL: http://elasticsearch:9200
      NEWS_SEARCH_INDEX: ${NEWS_SEARCH_INDEX:-ecom-keywords-v1}
      NEWS_DUPLICATE_SCORE: ${NEWS_DUPLICATE_SCORE:-0.5}
      NEWS_DUPLICATE_MIN_MATCHES: ${NEWS_DUPLICATE_MIN_MATCHES:-2}
      NEWS_MAX_KEYWORDS: ${NEWS_MAX_KEYWORDS:-8}
      AI_POLL_SECONDS: ${AI_POLL_SECONDS:-5}
      GIGACHAT_CLIENT_ID: ${GIGACHAT_CLIENT_ID:-}
      GIGACHAT_CLIENT_SECRET: ${GIGACHAT_CLIENT_SECRET:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}

  cleanup:
    <<: *app-image
    command: ["python", "-m", "app.cleanup_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *db-environment
      PGUSER: news_cleanup
      PGPASSWORD: ${NEWS_CLEANUP_PASSWORD:-local-cleanup}
      NEWS_CLEANUP_INTERVAL_MINUTES: ${NEWS_CLEANUP_INTERVAL_MINUTES:-60}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 7s
      retries: 12

volumes:
  postgres-data:
  elasticsearch-data:
